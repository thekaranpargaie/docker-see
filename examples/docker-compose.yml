name: dockersee-demo

services:
  api:
    image: my-api:latest
    build:
      context: ./api
      dockerfile: Dockerfile
      target: runtime
      args:
        NODE_ENV: production
    container_name: demo-api
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "127.0.0.1:9229:9229"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD:-secret}@postgres:5432/app
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
    env_file:
      - .env
    networks:
      - backend
      - frontend
    volumes:
      - ./api:/app
      - api-cache:/app/.cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    labels:
      com.dockersee.role: backend

  web:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
    networks:
      - frontend
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

  worker:
    build: ./worker
    command: node worker.js
    depends_on:
      - redis
      - postgres
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    networks:
      - backend
    volumes:
      - api-cache:/app/.cache

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    networks:
      - backend
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    networks:
      - backend
    volumes:
      - redis-data:/data

  mailpit:
    image: axllent/mailpit:latest
    profiles:
      - dev
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - backend

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  postgres-data:
  redis-data:
  api-cache:
    driver: local
